name: EAS build (Android preview APK)

# Manual only. Requires the EXPO_TOKEN repo secret (expo.dev → Access tokens)
# and each app linked to an EAS project once (`npx eas init` inside the app,
# which writes extra.eas.projectId into app.json).
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to build
        type: choice
        options: [both, client, realtor]
        default: both
      profile:
        description: eas.json build profile
        type: choice
        options: [preview, development, production]
        default: preview

jobs:
  build:
    name: eas build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, realtor]
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Skip notice
        if: env.EXPO_TOKEN == '' || (inputs.app != 'both' && inputs.app != matrix.app)
        run: echo "Skipping ${{ matrix.app }} (EXPO_TOKEN missing or app not selected)."

      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != '' && (inputs.app == 'both' || inputs.app == matrix.app)
      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != '' && (inputs.app == 'both' || inputs.app == matrix.app)
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != '' && (inputs.app == 'both' || inputs.app == matrix.app)
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        if: env.EXPO_TOKEN != '' && (inputs.app == 'both' || inputs.app == matrix.app)
      - name: eas build
        if: env.EXPO_TOKEN != '' && (inputs.app == 'both' || inputs.app == matrix.app)
        working-directory: apps/${{ matrix.app }}
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
