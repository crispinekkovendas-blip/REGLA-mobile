name: Android (Kotlin)

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml', '.github/scripts/**']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', '.github/scripts/**']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # GitHub OIDC token: proves to imoveisregla.com.br that this run is REGLA-mobile@main

jobs:
  build:
    name: build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Decode REGLA signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing key secret: using the throwaway debug key"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/regla-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/regla-release.jks" >> "$GITHUB_ENV"
      - name: Unit tests (all modules)
        run: ./gradlew :core:model:test testDebugUnitTest --stacktrace --continue
      - name: Assemble demo APKs (sample data, no Supabase)
        run: |
          ./gradlew :app-client:assembleDebug :app-realtor:assembleDebug --stacktrace
          # demo builds (".demo" app id, "REGLA Demo" name) stay CI artifacts only — never published
          mkdir -p dist-demo
          cp app-client/build/outputs/apk/debug/*.apk dist-demo/regla-cliente-demo.apk
          cp app-realtor/build/outputs/apk/debug/*.apk dist-demo/regla-corretor-demo.apk
      - name: Assemble live APKs (real Supabase data)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then echo "Supabase secrets not set, skipping live build"; exit 0; fi
          ./gradlew :app-client:assembleDebug :app-realtor:assembleDebug --stacktrace
          mkdir -p dist/live
          cp app-client/build/outputs/apk/debug/*.apk dist/live/regla-cliente.apk
          cp app-realtor/build/outputs/apk/debug/*.apk dist/live/regla-corretor.apk
      - name: Publish to imoveisregla.com.br/app
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        run: |
          RELEASE_BEARER=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=imoveisregla.com.br" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$RELEASE_BEARER"
          RELEASE_BEARER="$RELEASE_BEARER" python3 ../.github/scripts/publish_apks.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: android/**/build/reports/tests/
          if-no-files-found: ignore
      - name: Upload demo APKs
        uses: actions/upload-artifact@v5
        with:
          name: apks-demo
          path: android/dist-demo/*.apk
      - name: Upload live APKs
        uses: actions/upload-artifact@v5
        with:
          name: apks-live
          path: android/dist/live/*.apk
          if-no-files-found: ignore
