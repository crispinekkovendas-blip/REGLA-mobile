name: Android (Kotlin)

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Unit tests (all modules)
        run: ./gradlew :core:model:test testDebugUnitTest --stacktrace --continue
      - name: Assemble debug APKs
        run: ./gradlew :app-client:assembleDebug :app-realtor:assembleDebug --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: android/**/build/reports/tests/
          if-no-files-found: ignore
      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: apks
          path: android/app-*/build/outputs/apk/debug/*.apk
